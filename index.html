<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="タバタ">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>タバタタイマー</title>
</head>
<body>
  <main id="setup" class="screen">
    <h1>タバタタイマー</h1>
    <div id="fields" class="fields"></div>
    <div class="total">合計 <span id="total">0:00</span></div>
    <p class="note">※画面をロック（電源ボタン）すると音は鳴りません。<br>動作中は画面が自動で消えないようにしています。</p>
    <button id="soundTest" class="btn sub">音のテスト</button>
    <button id="start" class="btn primary">スタート</button>
  </main>

  <main id="run" class="screen" hidden>
    <div class="meta">
      <span id="setInfo"></span>
      <span id="roundInfo"></span>
    </div>
    <div class="center">
      <div id="phase" class="phase"></div>
      <div id="time" class="time"></div>
      <div id="next" class="next"></div>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="remain">残り <span id="remainTotal"></span></div>
    <div class="controls">
      <button id="stop" class="btn">終了</button>
      <button id="pause" class="btn primary">一時停止</button>
    </div>
  </main>

  <button id="audioOverlay" class="audio-overlay" hidden>
    <span class="big">🔇 音が止まっています</span>
    <span>画面をタップすると音が再開します</span>
  </button>

  <!-- 画面の自動ロック防止用（無音・映像のみの小さな動画をループ再生） -->
  <video id="keepAwake" src="nosleep.mp4" muted playsinline loop preload="auto" aria-hidden="true"></video>

  <script src="app.js"></script>
</body>
</html>
